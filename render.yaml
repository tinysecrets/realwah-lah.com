services:
  - type: web
    name: real-wah-lah-com
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Set Atlas connection string in Render Dashboard → Environment.
      - key: MONGO_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DB_NAME
        value: wahlah_prod
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        value: https://wah-lah.com
      - key: PASSWORD_RESET_PATH
        value: /reset-password
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: PORT
        value: "10000"
      # Bitcoin deposit processing (BlockCypher)
      - key: BLOCKCYPHER_TOKEN
        sync: false
      - key: BLOCKCYPHER_STATIC_ADDRESS
        sync: false
      - key: BLOCKCYPHER_HD_WALLET
        value: wah_lah_deposits
      - key: BTC_MIN_CONFIRMATIONS
        value: "1"
      - key: BTC_FALLBACK_USD
        value: "60000"
      - key: PUBLIC_API_URL
        sync: false

